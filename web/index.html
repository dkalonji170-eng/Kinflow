<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="KinFlow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="kinflow">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" sizes="64x64" href="favicon.png"/>

  <title>kinflow</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1a1a2e;
    }
  </style>

  <script>
    // Nettoie les anciens service workers et caches laissés par des builds
    // web précédents servis sur le même port : sans ce nettoyage, le
    // navigateur continuerait d'afficher l'ancienne compilation.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        regs.forEach(function (r) {
          r.unregister();
        });
      });
      window.addEventListener('load', function () {
        if (window.caches && caches.keys) {
          caches.keys().then(function (keys) {
            return Promise.all(
              keys.map(function (k) {
                return caches.delete(k);
              })
            );
          });
        }
      });
    }
  </script>
  <script>
    if (window.visualViewport) {
      let prevH = window.visualViewport.height;
      window.visualViewport.addEventListener('resize', () => {
        window.dispatchEvent(new Event('resize'));
        prevH = window.visualViewport.height;
      });
    }
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
