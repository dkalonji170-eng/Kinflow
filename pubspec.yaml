name: kinflow
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  provider: ^6.1.2
  geolocator: ^13.0.4
  flutter_map: ^7.0.2
  flutter_map_tile_caching: ^10.0.0
  latlong2: ^0.9.1
  flutter_compass: ^0.8.0
  http: ^1.2.2
  connectivity_plus: ^6.1.3
  supabase_flutter: ^2.8.4
  path_provider: ^2.1.4
  url_launcher: ^6.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/image.png
    - assets/kinflow.jpg
    - assets/kinflow_dark.jpg
    - assets/kinshasa.fmtc